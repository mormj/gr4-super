name: GNU Radio 4 integration

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:
    inputs:
      cmake_options:
        description: Space-separated CMake -D overrides for modules, repositories, and refs
        required: false
        default: ""

permissions:
  contents: read
  packages: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dco:
    name: DCO
    runs-on: ubuntu-latest
    steps:
      - name: Check commit signoffs
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v8
        with:
          script: |
            const commits = await github.paginate(github.rest.pulls.listCommits, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
              per_page: 100,
            });

            const missing = commits.filter(({ commit }) => !/^Signed-off-by:\s.+$/im.test(commit.message));

            for (const { sha } of missing) {
              core.error(`Commit ${sha} is missing a Signed-off-by line`);
            }

            if (missing.length > 0) {
              core.setFailed(`${missing.length} commit(s) missing DCO signoff`);
            }

  integration:
    name: Ubuntu 24.04 | GCC 14 | complete stack
    needs: dco
    runs-on: ubuntu-latest
    timeout-minutes: 120
    container:
      image: ghcr.io/gnuradio/ci:ubuntu-24.04-4.0

    env:
      CC: gcc-14
      CXX: g++-14
      CMAKE_BUILD_PARALLEL_LEVEL: "4"
      DISABLE_SENSITIVE_TESTS: "1"

    steps:
      - uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Configure
        shell: bash
        env:
          CMAKE_OPTIONS: ${{ inputs.cmake_options }}
        run: |
          cmake_args=(--preset full-ci)
          if [[ -n "${CMAKE_OPTIONS}" ]]; then
            read -r -a overrides <<< "${CMAKE_OPTIONS}"
            cmake_args+=("${overrides[@]}")
          fi
          cmake "${cmake_args[@]}"

      - name: Build and test the complete stack
        run: cmake --build --preset full-ci --target check

  studio-web-image:
    name: Publish Studio web image
    needs: dco
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v6

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: metadata
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/gnuradio4-studio
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-

      - name: Build and publish
        uses: docker/build-push-action@v6
        with:
          context: .
          file: containers/studio-web/Dockerfile
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}

      - name: Smoke test published image
        shell: bash
        run: |
          image="ghcr.io/${{ github.repository_owner }}/gnuradio4-studio:latest"
          docker pull "$image"
          container_id="$(docker run --detach --publish 127.0.0.1::8080 "$image")"
          cleanup() {
            docker logs "$container_id" || true
            docker rm --force "$container_id" || true
          }
          trap cleanup EXIT

          host_port="$(docker port "$container_id" 8080/tcp)"
          host_port="${host_port##*:}"
          for attempt in {1..60}; do
            if curl --fail --silent --show-error "http://127.0.0.1:${host_port}/api/healthz" >/dev/null; then
              curl --fail --silent --show-error "http://127.0.0.1:${host_port}/" >/dev/null
              exit 0
            fi
            if [ "$(docker inspect --format '{{.State.Running}}' "$container_id")" != "true" ]; then
              echo "Studio web container exited before becoming ready" >&2
              exit 1
            fi
            sleep 1
          done

          echo "Studio web container did not become ready" >&2
          exit 1
