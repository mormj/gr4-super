name: GNU Radio 4 integration

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:
    inputs:
      cmake_options:
        description: Space-separated CMake -D overrides for modules, repositories, and refs
        required: false
        default: ""

permissions:
  contents: read
  packages: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integration:
    name: Ubuntu 24.04 | GCC 14 | complete stack
    runs-on: ubuntu-latest
    timeout-minutes: 120
    container:
      image: ghcr.io/gnuradio/ci:ubuntu-24.04-4.0

    env:
      CC: gcc-14
      CXX: g++-14
      CMAKE_BUILD_PARALLEL_LEVEL: "4"
      DISABLE_SENSITIVE_TESTS: "1"

    steps:
      - uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Configure
        shell: bash
        env:
          CMAKE_OPTIONS: ${{ inputs.cmake_options }}
        run: |
          cmake_args=(--preset full-ci)
          if [[ -n "${CMAKE_OPTIONS}" ]]; then
            read -r -a overrides <<< "${CMAKE_OPTIONS}"
            cmake_args+=("${overrides[@]}")
          fi
          cmake "${cmake_args[@]}"

      - name: Build and test the complete stack
        run: cmake --build --preset full-ci --target check
